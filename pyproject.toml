[project]
name = "fish-kernel"
description = "Fish kernel for Jupyter"
authors = [
    { name = "UENO, M.", email = "eunosium-1128@live.jp" }
]
dependencies = [
    "pexpect>=4.9.0",
    "ipykernel>=6.29.4",
]
readme = "README.md"
requires-python = ">= 3.8"
dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true

[tool.rye.dev-dependencies]
"." = {path = ".", develop = true}

[tool.hatch.version]
path = "fish_kernel/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fish_kernel"]
