[project]
name = "fish-kernel"
description = "Fish kernel for Jupyter"
authors = [
    { name = "UENO, M.", email = "eunosium-1128@live.jp" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.29.4",
    "jupyter-client>=8.6.2",
    "pexpect>=4.9.0",
]
dynamic = ["version"]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "fish_kernel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fish_kernel"]
